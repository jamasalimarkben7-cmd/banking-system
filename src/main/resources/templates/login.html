<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}" />
<body>
<main class="auth-shell">
    <section class="auth-card">
        <p class="eyebrow">Northstar Banking</p>
        <h1>Welcome back.</h1>
        <p class="muted">Sign in to securely manage your accounts.</p>
        <div class="alert success" th:if="${param.logout}">You have been signed out.</div>
        <div class="alert error" th:if="${param.error}">Invalid username or password.</div>
        <form method="post" action="/login" class="stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label>Username<input type="text" name="username" autocomplete="username" required autofocus></label>
            <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
            <button type="submit" class="button primary">Sign in</button>
        </form>
    </section>
</main>
</body>
</html>
