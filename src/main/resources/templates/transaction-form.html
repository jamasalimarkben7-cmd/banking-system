<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Move money')}" />
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page narrow"><section class="page-heading"><div><p class="eyebrow">Secure transfer center</p><h1>Move money</h1></div></section>
<div class="tabs"><a th:classappend="${type == 'deposit' ? ' active' : ''}" href="/transactions/new?type=deposit">Deposit</a><a th:classappend="${type == 'withdraw' ? ' active' : ''}" href="/transactions/new?type=withdraw">Withdraw</a><a th:classappend="${type == 'transfer' ? ' active' : ''}" href="/transactions/new?type=transfer">Transfer</a></div>
<section class="form-panel"><div class="alert error" th:if="${error}" th:text="${error}"></div>
<form th:if="${type == 'deposit'}" method="post" action="/transactions/deposit" th:object="${transactionForm}" class="stack"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
<label>Account<select th:field="*{accountNumber}" required><option value="">Choose account</option><option th:each="account : ${accounts}" th:value="${account.accountNumber}" th:text="${account.accountType + ' · ' + account.accountNumber}"></option></select></label><label>Amount<input type="number" step="0.01" min="0.01" th:field="*{amount}" required></label><button class="button primary" type="submit">Deposit funds</button></form>
<form th:if="${type == 'withdraw'}" method="post" action="/transactions/withdraw" th:object="${transactionForm}" class="stack"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
<label>Account<select th:field="*{accountNumber}" required><option value="">Choose account</option><option th:each="account : ${accounts}" th:value="${account.accountNumber}" th:text="${account.accountType + ' · ' + account.accountNumber}"></option></select></label><label>Amount<input type="number" step="0.01" min="0.01" th:field="*{amount}" required></label><button class="button primary" type="submit">Withdraw funds</button></form>
<form th:if="${type == 'transfer'}" method="post" action="/transactions/transfer" th:object="${transactionForm}" class="stack"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
<label>From<select th:field="*{accountNumber}" required><option value="">Choose account</option><option th:each="account : ${accounts}" th:value="${account.accountNumber}" th:text="${account.accountType + ' · ' + account.accountNumber}"></option></select></label><label>To<input type="text" th:field="*{destinationAccountNumber}" placeholder="Recipient account number" required></label><label>Amount<input type="number" step="0.01" min="0.01" th:field="*{amount}" required></label><button class="button primary" type="submit">Transfer funds</button></form>
</section></main>
</body>
</html>
